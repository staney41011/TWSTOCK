name: Apply TWSTOCK upgrade once

on:
  push:
    branches:
      - feature/lazy-data-consensus-20260915
    paths:
      - .github/workflows/apply_upgrade_once.yml

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/lazy-data-consensus-20260915
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply source patches
        run: python tools/apply_upgrade_once.py

      - name: Build lightweight data manifest
        run: python -c "from data_index import rebuild_data_indexes; rebuild_data_indexes()"

      - name: Validate Python syntax and upgrade markers
        run: |
          python -m py_compile main.py data_index.py rerun_holy_grail.py backfill.py
          grep -q "策略共振" index.html
          grep -q "data/manifest.json" index.html
          grep -q "twstock-daily-scan" .github/workflows/daily_scan.yml

      - name: Remove one-time patch files
        run: |
          rm -f tools/apply_upgrade_once.py
          rm -f .github/workflows/apply_upgrade_once.yml

      - name: Commit upgrade
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Optimize data loading and add strategy consensus radar"
          git push origin feature/lazy-data-consensus-20260915
